<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lade-App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f7f7f7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
        }
        th {
            background: #eaeaea;
        }
        #summary {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border: 1px solid #ccc;
        }
        button {
            margin: 3px;
            padding: 4px 8px;
        }
        input {
            padding: 4px;
            margin-bottom: 10px;
            width: 150px;
        }
        .time-input {
            width: 70px;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>

<body>

<h1>Lade-App</h1>

<h3>Neuen Eintrag hinzufügen / bearbeiten</h3>

<label>Datum:</label>
<input type="date" id="datum"><br>

<label>Ort:</label>
<input type="text" id="ort"><br>

<label>% vor Ladung:</label>
<input type="number" id="vor"><br>

<label>% nach Ladung:</label>
<input type="number" id="nach"><br>

<label>KM vor Ladung:</label>
<input type="number" id="kmvor"><br>

<label>Rechn. kW:</label>
<input type="number" id="rechnkw" step="0.01"><br>

<label>Ladedauer:</label>
<input type="number" id="stunden" class="time-input" min="0" placeholder="Stunden">
<input type="number" id="minuten" class="time-input" min="0" max="59" placeholder="Minuten"><br>

<label>€ kW:</label>
<input type="number" id="eurokw" step="0.01"><br><br>

<button id="saveBtn" onclick="addNewEntry()">Eintrag speichern</button>

<hr>

<h3>Alle Ladevorgänge</h3>

<table>
    <thead>
        <tr>
            <th>Datum</th>
            <th>Ort</th>
            <th>% vor</th>
            <th>% nach</th>
            <th>% Diff</th>
            <th>Diff kW</th>
            <th>KM vor</th>
            <th>Gefahrene KM</th>
            <th>Rechn. kW</th>
            <th>Ladezeit</th>
            <th>€ kW</th>
            <th>Diesel €</th>
            <th>Diff Diesel-kwH €</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<div id="summary"></div>

<script src="script.js"></script>

</body>
</html>
