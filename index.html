<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lade‑App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f8f9fa;
        }
        h1 {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 6px 8px;
            text-align: center;
        }
        th {
            background-color: #e9ecef;
        }
        #summary {
            margin-top: 25px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h1>Lade‑App</h1>

    <!-- Eingabebereich -->
    <div id="inputArea">
        <label>Datum:</label>
        <input type="date" id="datum"><br><br>

        <label>Ort:</label>
        <input type="text" id="ort"><br><br>

        <label>Vor Laden:</label>
        <input type="number" id="vor"><br><br>

        <label>Nach Laden:</label>
        <input type="number" id="nach"><br><br>

        <label>Km vor Laden:</label>
        <input type="number" id="kmvor"><br><br>

        <label>Gesamtminuten:</label>
        <input type="number" id="minuten"><br><br>

        <label>€ kW:</label>
        <input type="number" id="eurokw" step="0.01"><br><br>

        <button onclick="addNewEntry()">Eintrag hinzufügen</button>
    </div>

    <!-- Tabelle -->
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Ort</th>
                <th>Vor</th>
                <th>Nach</th>
                <th>%</th>
                <th>kW‑Diff</th>
                <th>Km</th>
                <th>Rechn‑kW</th>
                <th>Minuten</th>
                <th>€ kW</th>
                <th>Diesel</th>
                <th>Diesel‑Diff</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <!-- Auswertung -->
    <div id="summary"></div>

    <script src="script.js"></script>
</body>
</html>
