<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChargePilot</title>
<link rel="manifest" href="manifest.json">


    <style>
    body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f7f7f7;
}

/* Überschrift */

h1 {
    display: flex;
    align-items: center;
    gap: 10px;
}

.title-icon {
    width: 50px;
    height: 50px;
    border-radius: 8px;
}

.app-header {
    margin-bottom: 20px;
}

.subtitle {
    color: #666;
    font-size: 0.95rem;
    margin-left: 60px;
    margin-top: -8px;
}

/* Karten */

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* Dashboard */

#dashboard {
    margin-bottom: 20px;
}

/* Formular */

.form-grid {
    display: grid;
    grid-template-columns: 180px 250px;
    gap: 10px;
    align-items: center;
    margin-bottom: 15px;
}

.form-grid label {
    font-weight: bold;
}

.form-grid input {
    width: 100%;
    box-sizing: border-box;
}

/* Eingabefelder allgemein */

input {
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
}

button {
    margin-top: 10px;
    padding: 8px 16px;
}

/* Tabelle */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    font-size: 12px;
    min-width: 1100px;
}

th,
td {
    border: 1px solid #ccc;
    padding: 6px;
    text-align: center;
}

th {
    background: #eaeaea;
}

/* Monatsauswertung */

.monthly-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
}

.monthly-grid .card {
    padding: 12px;
}

.monthly-grid .card img {
    width: 32px;
    height: 32px;
}

.monthly-icon {
    width: 40px;
    height: 40px;
    margin-bottom: 10px;
}

/* Auswertung */

#summary {
    margin-top: 20px;
}

/* Smartphone */

@media (max-width: 768px) {

    body {
        margin: 10px;
    }

    .form-grid {
        grid-template-columns: 1fr;
        gap: 6px;
    }

    .form-grid label {
        margin-top: 8px;
    }

    h1 {
        font-size: 2rem;
    }

    .card {
        padding: 15px;
    }

    .monthly-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}


</style>
</head>

<body>

<div class="app-header">

    <h1>
        <img src="icon-192.png" class="title-icon">
        ChargePilot
    </h1>

    <div class="subtitle">
        Lade-, Kosten- und Reichweitenanalyse
    </div>

</div>

<!-- Dashboard -->
<div id="dashboard"></div>

<!-- Eingabeformular -->
<div class="card">

    <h2>📝 Neuer Eintrag</h2>

    <div class="form-grid">

        <label>Datum:</label>
        <input type="date" id="datum">

        <label>Ort:</label>
        <input type="text" id="ort">

        <label>% vor Ladung:</label>
        <input type="number" id="vor">

        <label>% nach Ladung:</label>
        <input type="number" id="nach">

        <label>KM vor Ladung:</label>
        <input type="number" id="kmvor">

        <label>Rechn. kWh:</label>
        <input type="number" id="rechnkw" step="0.01">

        <label>Stunden:</label>
        <input type="number" id="stunden" min="0">

        <label>Minuten:</label>
        <input type="number" id="minuten" min="0" max="59">

        <label>€ kWh:</label>
        <input type="number" id="eurokw" step="0.01">

    </div>

    <button id="saveBtn" onclick="addNewEntry()">
        Eintrag speichern
    </button>

</div>
<!-- Tabelle -->


<div class="card">

    <h2>📋 Alle Ladevorgänge</h2>
<div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>Datum</th>
                <th>Ort</th>
                <th>% vor</th>
                <th>% nach</th>
                <th>% Diff</th>
                <th>Diff kW</th>
                <th>KM vor</th>
                <th>Gefahrene KM</th>
                <th>Rechn. kW</th>
                <th>Ladezeit</th>
                <th>€ kW</th>
                <th>Diesel €</th>
                <th>Diesel Diff €</th>
                <th></th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>
</div>

</div>

<div id="monthlySummary" class="card"></div>

<!-- Auswertung -->
<div id="summary" class="card"></div>

<script src="script.js"></script>


</body>
</html>
